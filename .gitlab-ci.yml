include:
  - project: "${CI_TEMPLATE_PROJECT}"
    file:
      - "/python/common.yml"
      - "/docker/common.yml"
      - "/helm/common.yml"

variables:
  SKIP_PUBLISH: "true"
  DEPLOYMENT_ENVIRONMENT: dev

build_image:
  extends: .build_image
  image:
    name: $CONTAINER_REGISTRY/kaniko-project/executor:v1.14.0-debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH =~ '/^(dev|test|stage|master)$/' || $CI_COMMIT_BRANCH =~ /^epic.*$/
      variables:
        BASE_BUILD_ARGS: "$PASS_REGISTRY --insecure -d $IMAGE"
        CI_REGISTRY: $DOCKER_LOCAL_SNAPSHOT
        IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
    - if: $CI_COMMIT_TAG =~ /^v\d+.\d+.\d+/
      variables:
        BASE_BUILD_ARGS: "$PASS_REGISTRY --insecure -d $IMAGE"
        CI_REGISTRY: $DOCKER_LOCAL_SNAPSHOT
        IMAGE_TAG: "$CI_COMMIT_TAG"

deploy:
  extends: .deploy_service
  environment: $DEPLOYMENT_ENVIRONMENT
  variables:
    NAMESPACE: $NAMESPACE
    K8S_CLUSTER: $K8S_CLUSTER
  rules:
    - if: $CI_COMMIT_BRANCH =~ '/^(dev|test|stage)$/' || $CI_COMMIT_BRANCH =~ /^epic.*$/
      variables:
        IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
        DEPLOYMENT_ENVIRONMENT: $CI_COMMIT_BRANCH
  script:
    - kubectl get ns ${NAMESPACE} || kubectl create ns ${NAMESPACE}
    - wget https://repo.severstal.severstalgroup.com/artifactory/public/kubernetes-rancher/internal-role-binding-new.yml
    - envsubst < internal-role-binding-new.yml | kubectl --insecure-skip-tls-verify apply -f -
    - kubectl -n ${NAMESPACE} create secret docker-registry container-registry
      --docker-server=${CI_REGISTRY}
      --docker-username=${CI_DEPLOY_USER}
      --docker-password=${CI_DEPLOY_PASSWORD} 2>/dev/null || true
    - if [[ "${HELM_VALUES_ENVSUBST}" == false  ]] ; 
        then 
         echo 'Helm values envsubst disabled!';
        else 
         envsubst < $HELM_VALUES_PATH/$HELM_VALUES_FILE > $HELM_VALUES_PATH/$HELM_VALUES_FILE.tmp && mv $HELM_VALUES_PATH/$HELM_VALUES_FILE.tmp $HELM_VALUES_PATH/$HELM_VALUES_FILE; 
        fi
    - kubectl -n ${NAMESPACE} delete svc ${CI_PROJECT_NAME_SLUG} --ignore-not-found=true || true
     - helm -n ${NAMESPACE} uninstall ${CI_PROJECT_NAME_SLUG} --wait 2>/dev/null || true
     - helm install ${CI_PROJECT_NAME_SLUG} -n ${NAMESPACE}
      ${HELM_PATH}
      --set env=${CI_ENVIRONMENT_SLUG}
      --set-string image.tag=${IMAGE_TAG}
      --set-string global.image.tag=${IMAGE_TAG}
      --set-string projectPath=${CI_PROJECT_PATH}
      --wait --timeout ${DEPLOY_TIMEOUT} --history-max ${HELM_REVISION_HISTORY_LIMIT} ${DEPLOY_OPTIONS}
    - wget https://repo.severstal.severstalgroup.com/artifactory/public/kubernetes/itop-data-config-map.yaml
    - envsubst < itop-data-config-map.yaml | kubectl --insecure-skip-tls-verify apply -f -

deploy:prod:
  extends: .deploy_service
  environment: prod
  variables:
    NAMESPACE: $NAMESPACE
    K8S_CLUSTER: $K8S_CLUSTER
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+.\d+.\d+/
      variables:
        IMAGE_TAG: "$CI_COMMIT_TAG"
    - if: $CI_COMMIT_BRANCH == 'master'
      variables:
        IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
